<title>안심 지킴이 시뮬레이션</title>
<style>
  /* layout: 가상 휴대폰 하나가 주인공. 위의 작은 막대로 체험 문자(카메라를 켜면 체험 QR)만 받고,
     로그인·검사 기록·QR 검사·붙여 넣기·연락처·로그아웃은 휴대폰 안 「안심 지킴이」 앱에서 한다. 실제 앱 첫 화면(/)과 같다. */
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --fg: #18181b;
    --line: #d4d4d8;
    --brand: #1d4ed8;
    --font:
      'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui,
      sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
      --bg: #0d1118;
      --surface: #171d29;
      --fg: #e9edf5;
      --line: #2f3747;
      color-scheme: dark;
    }
  }
  :root[data-theme='dark'] {
    --bg: #0d1118;
    --surface: #171d29;
    --fg: #e9edf5;
    --line: #2f3747;
    color-scheme: dark;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    word-break: keep-all;
  }
  .stage {
    box-sizing: border-box;
    width: 100%;
    max-width: 396px;
    min-height: 100dvh;
    margin: 0 auto;
    padding: 6px 8px 0;
    display: grid;
    /* 긴 QR 이름을 골라도 막대가 넓어지지 않게 한 칸 폭을 고정한다 */
    grid-template-columns: minmax(0, 1fr);
    align-content: start;
    justify-items: center;
    gap: 6px;
    /* 막대(약 68px)를 뺀 높이에 9:19로 맞춘다 */
    --vp-max: min(380px, calc(100vw - 16px), calc((100dvh - 72px) * 9 / 19));
  }
  .bar {
    box-sizing: border-box;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
  }
  .bar select {
    flex: 1;
    min-width: 0;
    min-height: 40px;
    padding: 0 8px;
    border: 2px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: inherit;
    font: inherit;
    font-size: 16px;
  }
  .bar button {
    min-height: 40px;
    padding: 0 16px;
    border: 0;
    border-radius: 8px;
    background: var(--brand);
    color: #fff;
    font: inherit;
    font-size: 16px;
    font-weight: 800;
    white-space: nowrap;
    cursor: pointer;
  }
  .bar button:active {
    transform: translateY(1px);
  }
  #phone {
    width: 100%;
    display: grid;
    justify-items: center;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  /* 휴대폰 화면(폭 480px 이하)에서는 가상 휴대폰의 테두리(베젤)·상태 표시줄을 없애고 화면 가득. PC는 그대로 */
  @media (max-width: 480px) {
    .stage {
      max-width: none;
      height: 100dvh;
      min-height: 0;
      padding: 0;
      gap: 0;
      grid-template-rows: auto minmax(0, 1fr);
      align-content: stretch;
      overflow: hidden;
    }
    .bar {
      border-width: 0 0 1px;
      border-radius: 0;
      padding: 6px 8px;
    }
    #phone {
      min-height: 0;
      height: 100%;
    }
    .stage .vp {
      max-width: none;
      height: 100%;
      aspect-ratio: auto;
      padding: 0;
      border-radius: 0;
      background: none;
      box-shadow: none;
    }
    .stage .vp::before,
    .stage .vp::after,
    .stage .vp-cam-hole,
    .stage .vp-status {
      display: none;
    }
    .stage .vp-scr {
      border-radius: 0;
    }
  }
</style>
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap"
/>
<main class="stage">
  <h1 class="sr-only">안심 지킴이 시뮬레이션 — 가상 휴대폰</h1>
  <div class="bar" id="bar" role="group" aria-label="문자 받기">
    <label for="sample" class="sr-only" id="pick-label">받아 볼 문자</label>
    <select id="sample"></select>
    <button type="button" id="recv">문자 받기</button>
  </div>
  <div id="phone"></div>
</main>
<script>
  /*SIM*/
</script>
<script>
  const guardian = Sim.createGuardianApp({
    analyzeMessage: (t, p) => Sim.analyzeScan('MESSAGE', t, p),
    analyzeQr: (t) => Sim.analyzeScan('QR', t),
    store: Sim.createMemoryStore(),
  });
  const phone = new Sim.VirtualPhone(document.getElementById('phone'), {
    apps: [guardian.app],
    qr: {
      count: guardian.qrCount,
      preview: (i) => guardian.qrPreview(i),
      scan: (i) => guardian.scanQr(i),
    },
    analyze: (t) => Sim.analyzeScan('MESSAGE', t, guardian.personal()),
    onEvent: (e) => {
      if (e.type === 'screen') setMode(e.screen === 'camera' ? 'qr' : 'sms');
      if (e.type === 'message-checked')
        guardian.record(e.message.app, e.message.text, e.result);
    },
  });
  const sel = document.getElementById('sample');
  // 막대: 카메라 앱에 있으면 "QR 비추기", 그 밖에는 "문자 받기"
  let mode = '';
  function setMode(next) {
    if (next === mode) return;
    mode = next;
    const qr = mode === 'qr';
    document
      .getElementById('bar')
      .setAttribute('aria-label', qr ? 'QR 코드 받기' : '문자 받기');
    document.getElementById('pick-label').textContent = qr
      ? '카메라에 비출 QR'
      : '받아 볼 문자';
    document.getElementById('recv').textContent = qr
      ? 'QR 비추기'
      : '문자 받기';
    sel.innerHTML = qr
      ? guardian.qrLabels
          .map((l, i) => `<option value="${i}">${l}</option>`)
          .join('')
      : Sim.DEMO_SAMPLES.map(
          (s) => `<option value="${s.id}">${s.label}</option>`,
        ).join('');
  }
  setMode('sms');
  const params = new URLSearchParams(location.search);
  if (params.get('app') === 'guardian')
    phone.openApp('guardian', params.get('view') || 'main');

  document.getElementById('recv').onclick = () => {
    if (mode === 'qr') return phone.showQr(Number(sel.value));
    const s = Sim.DEMO_SAMPLES.find((x) => x.id === sel.value);
    phone.receiveMessage({
      app: s.app === '문자' ? 'sms' : 'messenger',
      from: s.sender,
      text: s.content,
    });
  };
</script>
